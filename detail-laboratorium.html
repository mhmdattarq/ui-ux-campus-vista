<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Laboratorium - ITBRP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brand-red { color: #d32f2f; }
        .bg-brand-red { background-color: #d32f2f; }
        .brand-blue { color: #1565c0; }
        .bg-brand-blue { background-color: #1565c0; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="p-4 bg-white shadow-md">
        <a href="index.html" class="font-bold text-lg brand-blue">ITBRP</a>
        <a href="explore-laboratorium.html" class="ml-4 brand-red font-semibold">Explore Laboratorium</a>
    </nav>
    <div id="lab-details"></div>
    <script>
        const labs = {
            '1': {
                name: 'Laboratorium Komputer 1',
                facilities: ['Wifi', '2 Air Conditioner (AC)', '24 Personal Computer (PC)'],
                gallery: ['https://via.placeholder.com/600x400', 'https://via.placeholder.com/600x400'],
                virtualTour: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3960.902310196238!2d107.61529131477102!3d-6.90220199499889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e68e64c5e3a3c9d%3A0x2633a1e4a3b2b513!2sInstitut%20Teknologi%20Bandung!5e0!3m2!1sen!2sid!4v1626270000000!5m2!1sen!2sid'
            },
            '2': {
                name: 'Laboratorium Komputer 2',
                facilities: ['Wifi', '2 Air Conditioner (AC)', '18 Personal Computer (PC)'],
                gallery: ['https://via.placeholder.com/600x400', 'https://via.placeholder.com/600x400'],
                virtualTour: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3960.902310196238!2d107.61529131477102!3d-6.90220199499889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e68e64c5e3a3c9d%3A0x2633a1e4a3b2b513!2sInstitut%20Teknologi%20Bandung!5e0!3m2!1sen!2sid!4v1626270000000!5m2!1sen!2sid'
            },
            '3': {
                name: 'Laboratorium Komputer 3',
                facilities: ['Wifi', '2 Air Conditioner (AC)', '30 Personal Computer (PC)'],
                gallery: ['https://via.placeholder.com/600x400', 'https://via.placeholder.com/600x400'],
                virtualTour: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3960.902310196238!2d107.61529131477102!3d-6.90220199499889!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e68e64c5e3a3c9d%3A0x2633a1e4a3b2b513!2sInstitut%20Teknologi%20Bandung!5e0!3m2!1sen!2sid!4v1626270000000!5m2!1sen!2sid'
            }
        };

        const params = new URLSearchParams(window.location.search);
        const labId = params.get('id');
        const lab = labs[labId];

        if (lab) {
            const container = document.getElementById('lab-details');
            container.innerHTML = `
                <header class="h-64 bg-cover bg-center" style="background-image: url('https://via.placeholder.com/1200x400')">
                    <div class="bg-black bg-opacity-50 h-full flex items-center justify-center">
                        <h1 class="text-4xl font-bold text-white">${lab.name}</h1>
                    </div>
                </header>
                <main class="max-w-6xl mx-auto p-6">
                    <section class="bg-white p-6 rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold brand-blue">Fasilitas</h2>
                        <ul class="list-disc list-inside mt-4 text-gray-700">
                            ${lab.facilities.map(f => `<li>${f}</li>`).join('')}
                        </ul>
                    </section>
                    <section class="mt-6 bg-white p-6 rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold brand-blue">Galeri</h2>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
                            ${lab.gallery.map(img => `<img src="${img}" class="rounded-lg" alt="Galeri">`).join('')}
                        </div>
                    </section>
                    <section class="mt-6 bg-white p-6 rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold brand-blue">Virtual Tour 360</h2>
                        <iframe class="w-full h-96 mt-4" src="${lab.virtualTour}" allowfullscreen></iframe>
                    </section>
                </main>
            `;
        }
    </script>
</body>
</html>
